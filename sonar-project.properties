# SonarQube Cloud CI-based analysis (workflow .github/workflows/rust.yml, job sonar).
# sonar.projectVersion and sonar.qualitygate.wait are passed by the workflow.
sonar.organization=juanmitaboada
sonar.projectKey=juanmitaboada_redismultiplexer
sonar.projectName=RedisMultiplexer
sonar.sourceEncoding=UTF-8

# Root as sources so Cargo.toml, Cargo.lock and .github/workflows stay analysed.
sonar.sources=.
sonar.tests=tests,bench
sonar.test.inclusions=tests/**,bench/test_*.py
sonar.exclusions=tests/**,bench/test_*.py,target/**
# The bench harness has no coverage tool (standard library only).
sonar.coverage.exclusions=bench/**
sonar.python.version=3.11

# Clippy runs in CI with the same flags as gate 4; Sonar's own Clippy run is off.
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=target/clippy-report.json
sonar.rust.lcov.reportPaths=target/lcov.info
